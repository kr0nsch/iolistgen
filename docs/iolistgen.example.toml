# Пример настроек iolistgen. Скопируйте в корень проекта под именем iolistgen.toml:
# файл ищется рядом с перечнем и выше по каталогам до корня репозитория.
# Все параметры необязательны; ниже — значения по умолчанию.

[naming]
# Правило тегов сигналов: позиция в духе ГОСТ 21.208-2013 (буквенный код + номер: LT101,
# PT201, P101) и суффиксы через «_» (P101_RUN). Сверить с проектным стандартом обозначений.
tag_regex = '^[A-Z]{1,4}[0-9]{1,4}[A-Z]?(_[A-Z0-9]+)*$'
# Правило имён устройств (колонка device): позиция без суффиксов
device_regex = '^[A-Z]{1,4}[0-9]{1,4}[A-Z]?$'
# Предел длины имени устройства: оно входит в коды тревог (<DEV>.<SUFFIX>) и теги SCADA
max_device_length = 24

[modbus]
# 0 — в перечне адреса PDU с нуля (как в конфигураторе CODESYS); 1 — нумерация с единицы
address_base = 0
# Порядок слов 32/64-битных значений, если колонка mb_order пуста: "HL" или "LH".
# Не задан — у каждой такой строки предупреждение IOL408 и принимается HL.
# default_word_order = "HL"

[input]
# Лист книги XLSX; по умолчанию — первый лист со строкой заголовка
# sheet = "Перечень"
# Кодировка CSV; обычный CSV из Excel в русской Windows — "cp1251"
encoding = "utf-8"
# Разделитель CSV: ";", "," или "\t"; по умолчанию определяется по строке заголовка
# delimiter = ";"
# Колонки, которые не нужно читать и о которых не нужно предупреждать
ignore_columns = ["№ п/п", "Примечание"]
# Дополнительные синонимы заголовков: «как в файле» = «колонка схемы»
column_aliases = { "Позиция по схеме" = "tag", "Наименование параметра" = "description" }
# Сколько строк сверху просматривать в поисках строки заголовка
header_search_rows = 30

[severity]
# Уровень правил: "error", "warning" или "off". Структурные правила (в docs/schema.md, раздел 11,
# «Ослабить: нет» — тег, роль, тип устройства, адрес Modbus…) понизить нельзя: ошибка настроек.
# IOL104 = "warning"   # правило тегов — пока предупреждение
# IOL414 = "off"       # Modbus TCP: адреса слейвов 248…255 допустимы
# IOL416 = "off"       # Modbus TCP: Unit ID 0 допустим (в Modbus RTU адрес 0 — широковещательный)

[generators.docs-table]
# Опции генераторов: [generators.<имя>]; список — iolistgen generate --list
filename = "signal_list.md"
