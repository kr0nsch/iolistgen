# Обоснованные находки iec_checker (tools/check/run_iec_checker.py).
# Обоснованная находка попадает в отчёт со статусом allowed и не роняет проверку.
# Подробный разбор каждой записи — docs/STATIC_ANALYSIS.md; при изменении кода держите их согласованными.
#
# Ключи записи [[allow]]:
#   id     — идентификатор правила iec_checker (шаблон fnmatch), например "PLCOPEN-CP3";
#   file   — шаблон fnmatch пути исходника (src/POUs/...) или имени собранного файла (FB_X.st);
#            '*' захватывает и '/';
#   match  — необязательно: регулярное выражение по тексту сообщения;
#   reason — обязательно: почему находка допустима;
#   checker — необязательно: "v0.4" (обязательная проверка, бинарник) или "nightly" (необязательное
#            задание CI, Docker-образ, закреплённый по дайджесту в ci.yml). Запись с этим ключом
#            применяется и проверяется на использование только при прогоне своей версией.
# ParserError и LexingError обосновать нельзя: их исправляют в коде или в понижении iec-checker.
# С --tests (v0.4) используется каждая запись, кроме checker = "nightly" (проверяет pytest:
# test_run_iec_checker.py::test_integration_repository_sources). Записи для образа nightly (когда они
# появятся) — в последнем разделе: их пересматривают вместе с дайджестом образа.

[[allow]]
id = "PLCOPEN-CP3"
file = "src/*"
reason = "Переменная без явного начального значения получает значение по умолчанию своего типа (МЭК 61131-3, как в CODESYS); вариант сборки iec-checker убирает неконстантные начальные значения"

[[allow]]
id = "PLCOPEN-CP3"
file = "tests/*"
reason = "Как для src/: значения по умолчанию типов; результаты тестов присваиваются до чтения"

[[allow]]
id = "PLCOPEN-CP9"
file = "src/POUs/Generated/*"
reason = "Код, сгенерированный iolistgen по перечню КНС-1: линейная последовательность вызовов устройств и присваиваний Cfg без ветвлений (одно IF — команда HMI «применить уставки проекта»); iec_checker 0.4 считает каждое обращение к экземпляру и присваивание, число растёт с числом устройств перечня"

[[allow]]
id = "PLCOPEN-CP9"
file = "tests/*"
reason = "Наборы тестов — последовательные вызовы и проверки без ветвлений (классическая сложность — 1); завышенный подсчёт iec_checker 0.4, метрика для тестов не показательна"

[[allow]]
id = "PLCOPEN-L17"
file = "src/POUs/Generated/PRG_Devices/PRG_Devices.impl.st"
reason = "Команда HMI «применить уставки проекта» не пришла — делать нечего; пустая ветка ELSE в сгенерированном коде только добавит шум"

[[allow]]
id = "UnusedVariable"
file = "tests/POUs/FB_ProjectCfg_Test/CheckCfg.method.decl.st"
match = "SDEVICE|STCOMMON"
reason = "Ложное срабатывание iec_checker 0.4: вход метода используется в CONCAT(sDevice, ...), структура — чтением полей stCommon.wCfgErr и stCommon.wStatus"

[[allow]]
id = "UnusedVariable"
file = "tests/POUs/PRG_Tests/PRG_Tests.decl.st"
match = "FBPROJECTCFGTEST"
reason = "Экземпляр набора регистрируется в coUnit самим объявлением и используется вызовом AreAllTestsFinished()"

[[allow]]
id = "PLCOPEN-L17"
file = "src/POUs/PRG_Main/PRG_Main.impl.st"
reason = "Задание оператора восстанавливается из GVL_Persist один раз после старта; в остальных циклах делать нечего, пустая ветка ELSE только добавит шум"

[[allow]]
id = "UnusedVariable"
file = "tests/POUs/*_Test/*_Test.decl.st"
match = "variable: [A-Z][A-Z0-9]*(_[A-Z0-9]+)+$"
reason = "Артефакт понижения: константы набора (VAR CONSTANT, UPPER_SNAKE_CASE) используются в методах-тестах, которые сборка выносит в отдельные функции"

# =====================================================================================================
# Только образ nightly (checker = "nightly"): правило PLCOPEN-CP17 «неиспользуемый параметр». В v0.4
# этого правила нет; находка проверена по исходникам, дефекта нет
# =====================================================================================================

[[allow]]
id = "PLCOPEN-CP17"
file = "tests/POUs/FB_ProjectCfg_Test/CheckCfg.method.decl.st"
checker = "nightly"
match = "parameter 'STCOMMON'"
reason = "Ложное срабатывание CP17: VAR_IN_OUT CONSTANT stCommon читается через поля (stCommon.wCfgErr, stCommon.wStatus); обращение к полям CP17 не считает чтением"
